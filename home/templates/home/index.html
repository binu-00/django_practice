{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'home/style.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie reccomendation System</title>

    <style>
        body {
            background-color: #101827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 80px 20px;
        }

        .card {
            background-color: #1e293b;
            padding: 35px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
        }

        h1 {
            color: #38bdf8;
        }

        p {
            color: #cbd5e1;
        }

        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <nav>
    <h2>CineMood AI</h2>

    <div>
        <a href="/">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </div>
</nav>

<section id="about">
    <h1>Welcome to CineMood AI</h1>
    <p class="tagline">Find Movies That Match Your Mood!</p>
    <p class="description">Discover movies based on your Taste, Mood and your Favorite genres</p>
</section>

<section id="contact">
    <h2>Contact Us</h2>
    <p>Email: binupj00@gmail.com</p>
</section>
<section id="contact">
    <h2>Login</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Enter your name" required>

        <br><br>

        <input type="email" name="email" placeholder="Enter your email" required>

        <br><br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
